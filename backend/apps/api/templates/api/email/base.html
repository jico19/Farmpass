<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FarmPass{% endblock %}</title>
</head>
<body style="margin:0;background-color:#f3f4ef;color:#243128;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;background-color:#f3f4ef;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:600px;background-color:#ffffff;border:1px solid #dfe5dc;border-radius:12px;overflow:hidden;">
          <tr>
            <td style="padding:28px 32px;background-color:#174d32;color:#ffffff;">
              <div style="font-size:28px;font-weight:700;letter-spacing:-0.5px;">FarmPass</div>
              <div style="margin-top:6px;font-size:12px;line-height:18px;letter-spacing:1.2px;text-transform:uppercase;color:#d8eadf;">Official Livestock Transport Permit Service</div>
              <div style="margin-top:3px;font-size:13px;line-height:20px;color:#ffffff;">Municipality of Sariaya</div>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;font-size:16px;line-height:25px;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:24px 32px;background-color:#f7f8f5;border-top:1px solid #e3e7e0;color:#59655d;font-size:12px;line-height:19px;">
              <strong style="color:#34463a;">Municipal Agriculture Office</strong><br>
              Sariaya Municipal Hall, Sariaya, Quezon<br>
              <a href="mailto:agri@sariaya.gov.ph" style="color:#276749;text-decoration:none;">agri@sariaya.gov.ph</a>
              &nbsp;&middot;&nbsp; (042) 525-8200
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
